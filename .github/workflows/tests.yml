name: tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - name: Set up Python
        run: uv python install 3.10
      - name: Install dependencies
        run: uv sync --locked
      - name: Run tests
        run: PYTHONDONTWRITEBYTECODE=1 uv run pytest -q
      - name: Run lint
        run: uv run ruff check src tests
